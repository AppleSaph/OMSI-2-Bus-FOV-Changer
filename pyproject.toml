[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omsi-fov-changer"
version = "0.1.0"
description = "Desktop tool for editing camera FOV values in OMSI 2 bus files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7; python_version < '3.15'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
